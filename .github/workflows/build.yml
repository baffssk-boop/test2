name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bygg apparna
        run: gradle :app:assembleDebug :game:assembleDebug --no-daemon --stacktrace

      - name: Döp om APK-filerna
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OEE-raknare.apk
          cp game/build/outputs/apk/debug/game-debug.apk Kartkriget.apk

      - name: Spara som byggartefakter
        uses: actions/upload-artifact@v4
        with:
          name: appar
          path: |
            OEE-raknare.apk
            Kartkriget.apk

      - name: Publicera som release (lätt att ladda ner från telefonen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" OEE-raknare.apk Kartkriget.apk \
            --title "Bygge ${{ github.run_number }}" \
            --notes "Ladda ner Kartkriget.apk eller OEE-raknare.apk och öppna filen på din Android för att installera." \
            --latest
